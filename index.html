<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharedEasy Sales Academy</title>
<style>
  :root{--cream:#FFFAF2;--ink:#1a1a1a;--accent:#FF7932;--accent-d:#e65f17;--line:#1a1a1a;--muted:#6b6b6b;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:38px 32px;text-align:center}
  .logo{font-weight:800;font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
  .logo span{color:var(--accent-d)}
  .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
  label{display:block;text-align:left;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:7px}
  .row{display:flex;gap:8px}
  input[type=password]{flex:1;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;outline:none;background:var(--cream)}
  input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,121,50,.18)}
  button{margin-top:16px;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;cursor:pointer;transition:background .12s}
  button:hover{background:var(--accent-d)}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#c0392b;font-size:13.5px;margin-top:14px;min-height:18px;font-weight:600}
  .hint{color:var(--muted);font-size:12px;margin-top:22px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Shared<span>Easy</span> Sales Academy</div>
    <div class="sub">Internal training. Enter the team password to continue.</div>
    <form id="f" autocomplete="off">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <button id="btn" type="submit">Unlock</button>
      <div class="err" id="err"></div>
    </form>
    <div class="hint">For SharedEasy team members only.</div>
  </div>

var ITER=200000;
function b2a(b){var s="";var u=new Uint8Array(b);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return s;}
async function unlock(pw){
  var data=Uint8Array.from(atob(PAYLOAD),function(c){return c.charCodeAt(0);});
  var salt=data.slice(0,16), iv=data.slice(16,28), ct=data.slice(28);
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var ptBuf=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  return new TextDecoder().decode(ptBuf);
}
function render(html){ document.open(); document.write(html); document.close(); }
var f=document.getElementById("f"), pw=document.getElementById("pw"), err=document.getElementById("err"), btn=document.getElementById("btn");
async function tryUnlock(p,silent){
  err.textContent=""; btn.disabled=true; btn.textContent="Unlocking...";
  try{
    var html=await unlock(p);
    try{ sessionStorage.setItem("se_ok", p); }catch(e){}
    render(html);
  }catch(e){
    btn.disabled=false; btn.textContent="Unlock";
    if(!silent){ err.textContent="Incorrect password. Please try again."; pw.select(); }
  }
}
f.addEventListener("submit",function(ev){ ev.preventDefault(); if(pw.value) tryUnlock(pw.value,false); });
// auto-unlock within the same browser session
try{ var saved=sessionStorage.getItem("se_ok"); if(saved){ tryUnlock(saved,true);} }catch(e){}
